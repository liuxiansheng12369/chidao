name: Release APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 发布说明（留空则套用 .github/RELEASE_TEMPLATE.md）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing key
        env:
          JKS_BASE64: ${{ secrets.RELEASE_JKS_BASE64 }}
        run: |
          if [ -n "${JKS_BASE64}" ]; then
            printf '%s' "${JKS_BASE64}" | base64 -d > release-v3.jks
            echo "签名密钥：来自 Secrets (RELEASE_JKS_BASE64)"
          elif [ -f release-v3.jks ]; then
            echo "签名密钥：使用仓库内的 release-v3.jks"
          else
            echo "没有签名密钥，无法打包" >&2
            exit 1
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # 空的 Secret 会以空字符串注入，gradle 里会当成路径 ""，必须清掉让它回落到默认值
          for v in RELEASE_STORE_FILE RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            eval "value=\$$v"
            if [ -z "$value" ]; then unset "$v"; fi
          done
          chmod +x gradlew
          ./gradlew :lyricon:assembleStandardRelease --console=plain --stacktrace

      - name: Read version
        id: version
        run: |
          CODE=$(grep -oP 'extra\["appVersionCode"\] = \K\d+' build.gradle.kts | head -1)
          REL=$(grep -oP 'extra\["appReleaseVersionName"\] = "\K[0-9.]+' build.gradle.kts | head -1)
          PATCH=$(grep -oP 'extra\["appTestPatch"\] = \K\d+' build.gradle.kts | head -1)
          if [ "$PATCH" = "0" ]; then
            VERSION="$REL"
          else
            VERSION="$(echo "$REL" | cut -d. -f1,2).$PATCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION (code $CODE)"

      - name: Collect APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(ls -t build/all-apks/release/*.apk | head -1)
          echo "产物：$APK"
          cp "$APK" "词岛-${VERSION}-arm64-v8a.apk"
          ls -lh "词岛-${VERSION}-arm64-v8a.apk"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "chore: release ${{ steps.version.outputs.version }} (code ${{ steps.version.outputs.code }})"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Write release notes
        env:
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
          else
            sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{VERSION_CODE}}/${VERSION_CODE}/g" \
              .github/RELEASE_TEMPLATE.md > notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" "词岛-${VERSION}-arm64-v8a.apk" \
            --title "词岛 ${VERSION}" \
            --notes-file notes.md
